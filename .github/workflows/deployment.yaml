name: App buid

on:
  push:
    branches:
      - dev
env:
  BUILD_NAME: "${{ vars.DOCKER_HUB_USERNAME }}/${{ vars.PROJECT_NAME }}"
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set FULL_BUILD_NAME
        id: extract-full-build-name
        run: |
          FULL_BUILD_NAME=$BUILD_NAME:${{ github.sha }}
          echo "FULL_BUILD_NAME=$FULL_BUILD_NAME" >> $GITHUB_ENV

      - name: Extract branch name
        run: |
          CURRENT_BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "CURRENT_BRANCH=$CURRENT_BRANCH" >> $GITHUB_ENV

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests && build
        run: mvn --batch-mode clean package

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $FULL_BUILD_NAME .

      - name: Push Docker image
        run: docker push $FULL_BUILD_NAME

      - name: Update Chart.yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          valueFile: 'helm/beproject/Chart.yaml'
          changes: |
            {
              "version": "${{ github.sha }}",
              "version": "1-${{ steps.extract_branch.outputs.branch }}-${{ github.sha }}"
            }
          commitChange: false

      - name: Update Values.yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          valueFile: 'helm/beproject/values.yaml'
          changes: |
            {
              "image.repository": "${{ vars.DOCKER_HUB_USERNAME }}/${{ vars.PROJECT_NAME }}",
              "image.tag": "${{ github.sha }}",
              "namespace": "${{ steps.extract_branch.outputs.branch }}",
              "ingress.host": "${{ steps.extract_branch.outputs.branch }}${{ vars.URL_POSTFIX }}"
            }
          commitChange: false

      - name: Clone helm repository
        run: |
          git clone https://github.com/ArthurF-java/helm-be.git
          helm package helm/beproject -d ./helm-be/${{ steps.extract_branch.outputs.branch }}

      - name: Set up global config
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: push to helm repository
        run: |
          cd helm-be
          helm repo index --url "https://arthurf-java.github.io/helm-be/" --merge index.yaml .
          git add --all
          git commit -m "${{ steps.extract_branch.outputs.branch }}"
          git push https://${{ secrets.TOKEN_GITHUB }}@github.com/arthurf-java/helm-be.git main
          cd ..













