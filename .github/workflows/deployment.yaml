name: Docker-compose

on:
  workflow_dispatch:
    inputs:
      button_name:
        description: 'Setup app'
#env:
#  BUILD_NAME: "${{ vars.APP_NAME }}:${{ vars.APP_VERSION }}"
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests&build
        run: mvn --batch-mode clean package

      - name: Build docker image
        run: docker build -t ${{ env.BUILD_NAME }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/${{ vars.PROJECT_NAME }}${{ steps.extract_branch.outputs.branch }}:${GITHUB_SHA} .

      - name: check images
        run: docker images

