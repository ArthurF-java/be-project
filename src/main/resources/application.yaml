server:
  port: 8090
  servlet:
    context-path: /app

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

spring:
  profiles:
    active: ${ACTIVE_PROFILE:default}
  datasource:
    url: jdbc:postgresql://${DB_URL}?currentSchema=public
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      database: 0
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000
      connect-timeout: 1000
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: -1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database: postgresql

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
  graphql:
    cors:
      allowed-origin-patterns: "*"
