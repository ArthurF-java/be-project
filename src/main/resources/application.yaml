server:
  port: 8090
  servlet:
    context-path: /app

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

spring:
  profiles:
    active: ${ACTIVE_PROFILE:default}
  datasource:
    #    url: jdbc:${SPRING_JPA_DATABASE}://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${SCHEMA_DB}
    #    username: ${POSTGRES_USER}
    #    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://${DB_URL}?currentSchema=public
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database: postgresql

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
  graphql:
    cors:
      allowed-origin-patterns: "*"
